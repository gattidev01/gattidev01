name: Snake - cobrinha animada
 
on:
  schedule:
    - cron: "0 0 * * *"   # roda todos os dias à meia-noite (UTC)
  workflow_dispatch: {}    # permite rodar manualmente pela aba "Actions"
  push:
    branches:
      - main
 
permissions:
  contents: write
 
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3
 
      - name: Gerar SVG da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Publicar no branch "output"
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          commit_message: "Atualiza animação da cobrinha [skip ci]"
